<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
<style>
body{
   background-image:url("https://handluggageonly.co.uk/wp-content/uploads/2023/10/Best-Things-To-Do-In-Paris-France-7.jpg");
   background-size:cover;}
p{
     color:white;
     background-color:blue;
     padding:10px;
     border:1px solid black;}

</style>
<body class="w3-container">

<h1>Explore Cities</h1>
<p>Discover three great European destinations.</p>

<div class="w3-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">

<div class="w3-container w3-card">
    <h2>London</h2>
    <p>Explore one of the world's great cities.</p>
    <p>
       <a href="https://google.com" target="blank">
       <button class="w3-button w3-yellow">Explore</button>
       </a>
    </p>
</div>

<div class="w3-container w3-card">
  <h2>Paris</h2>
  <p>Discover art, food, and architecture.</p>
  <p>
     <a href="https://google.com" target="blank">
     <button class="w3-button w3-yellow">Explore</button>
     </a>
  </p>
</div>

<div class="w3-container w3-card">
  <h2>Rome</h2>
  <p>Experience thousands of years of history.</p>
  <p>
      <a href="https://google.com" target="blank">
     <button class="w3-button w3-yellow">Explore</button>
     </a>
  </p>
</div>

</div>

</body>
</html>
